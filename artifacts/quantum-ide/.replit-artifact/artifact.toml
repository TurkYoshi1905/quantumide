kind = "web"
previewPath = "/"
title = "QuantumIDE"
version = "1.0.0"
id = "artifacts/quantum-ide"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20784

[services.development]
run = "pnpm --filter @workspace/quantum-ide run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/quantum-ide", "run", "build" ]
publicDir = "artifacts/quantum-ide/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20784"
BASE_PATH = "/"
